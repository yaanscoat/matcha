<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="matcha">
  <!--
    matcha/public/assets/logo.svg — the brand, in 2KB of SVG.
    A bowl of matcha with a leaf floating on top. Drawn by hand, judged by git.

    Scaling notes: everything is sized for a 64px box but stays legible at 16px
    (the favicon size), which is the only logo spec that actually matters.
    If you edit the leaf, keep the tip clear of the steam paths or they merge
    into a green blob at small sizes. Ask me how I know.
  -->
  <defs>
    <linearGradient id="bowl" x1="0" y1="22" x2="0" y2="53" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8fbf6b" />
      <stop offset="1" stop-color="#4f7a3a" />
    </linearGradient>
  </defs>

  <!-- steam, because a cold bowl of leaf water is just sad -->
  <g fill="none" stroke="#9fbf6b" stroke-width="3" stroke-linecap="round" opacity="0.75">
    <path d="M24 3c-4 4 4 7 0 11" />
    <path d="M40 3c-4 4 4 7 0 11" />
  </g>

  <!-- bowl body -->
  <path d="M6 22C6 41 17.2 53 32 53S58 41 58 22Z" fill="url(#bowl)" />

  <!-- foam / rim -->
  <ellipse cx="32" cy="22" rx="26" ry="6.5" fill="#d9efb4" />
  <ellipse cx="32" cy="22" rx="19" ry="4.4" fill="#c3e398" />

  <!-- the leaf: the one detail that keeps this from being a soup emoji -->
  <path d="M32 12c5 4 5 12 0 15.5-5-3.5-5-11.5 0-15.5Z" fill="#6fa34a" />
  <path d="M32 14.5v11" stroke="#d9efb4" stroke-width="1.4" stroke-linecap="round" />
</svg>
